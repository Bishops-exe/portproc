[package]
name = "portproc"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"       # Optimize for size more aggressively than "s"
lto = true            # Enable Link Time Optimization to remove dead code
codegen-units = 1     # Compile in a single unit for better whole-program optimization
panic = 'abort'       # Remove stack unwinding logic
strip = true          # Strip all symbols from the binary

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
sysinfo = "0.39.6"
thiserror = "2.0.19"
phf = { version = "0.14.0", features = ["macros"] }
libc = "0.2.189"
term_size = "0.3.2"
log = "0.4.33"
env_logger = "0.11"
netstat2 = "0.11.2"


[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
